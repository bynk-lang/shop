# End-to-end checks: serve the four contexts with `bynk dev` and run
# e2e/scenarios.sh against them.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for BYNK_VERSION)
        type: string
        default: ""
  # bynk-canary.yml calls this at each new Bynk release, so the scenarios
  # also run against releases newer than the baseline.
  workflow_call:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for BYNK_VERSION)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scenarios:
    name: Scenarios
    runs-on: ubuntu-latest
    env:
      # Not secrets: throwaway keys for a server that only exists for this
      # job. The scenarios sign their own tokens and webhooks with them.
      AUTH_JWT_SECRET: e2e-only-not-a-secret
      PAYMENTS_WEBHOOK_SECRET: e2e-only-not-a-webhook-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bynk-lang/bynk-dev@v1
        with:
          # Pushes and pull requests use BYNK_VERSION, so a red build means
          # your change broke it. The canary passes newer releases in, and
          # proposes moving BYNK_VERSION once one passes.
          version: ${{ inputs.version }}
          version-file: ${{ !inputs.version && 'BYNK_VERSION' || '' }}
          # The fake payment processor, and the `/__scheduled` route the
          # scenarios use to run the stale-reservation sweeper on demand.
          wrangler-args: >-
            --var AUTH_JWT_SECRET:${{ env.AUTH_JWT_SECRET }}
            --var PAYMENTS_WEBHOOK_SECRET:${{ env.PAYMENTS_WEBHOOK_SECRET }}
            --var PAYMENTS_PROCESSOR:fake
            --test-scheduled
          run: ./e2e/scenarios.sh
