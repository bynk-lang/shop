# Bynk canary: re-run this repository's checks against a new Bynk release, and
# keep a `canary` issue open while they fail.
#
# Triggered by the org dispatcher in bynk-lang/.github (on each Bynk release,
# and weekly), which is why there is no `schedule` here. To take part, this
# repository must be listed in bynk-lang/.github's canary/repos.json and have
# the canary GitHub App installed. See README.md ("Enrol in the canary") and
# https://github.com/bynk-lang/.github/blob/main/canary/README.md
#
# `e2e` runs the end-to-end scenarios at the dispatched version. canary.yml
# runs the format check, type check, tests and a deploy dry run itself, and
# takes the e2e result as `upstream-result`, so a break in any of them opens
# or updates the one `canary` issue.
name: Bynk canary

on:
  repository_dispatch:
    types: [bynk-canary]
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version, exact ("0.371.3") or "latest"
        type: string
        default: latest

permissions:
  contents: read
  issues: write
  id-token: write   # canary.yml reports with the run's GitHub OIDC token

jobs:
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}

  canary:
    name: Canary
    needs: e2e
    if: ${{ !cancelled() }}
    uses: bynk-lang/.github/.github/workflows/canary.yml@a3e43de009be70aef77cb53e54994b824859a58b # v1.1.3
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
      upstream-result: ${{ needs.e2e.result }}
      kind: example
      source: .
      deploy-dry-run: true
      bump: true            # propose moving BYNK_VERSION to a newer release that passes
      # canary.yml takes its scripts from this ref of bynk-lang/.github, so it
      # names the same commit as `uses:` above. Dependabot moves `uses:` only:
      # move this to the same commit in that pull request.
      canary-ref: a3e43de009be70aef77cb53e54994b824859a58b
    # Only the bump App's two secrets (organisation secrets), not
    # `secrets: inherit`, which would pass every secret this repository has.
    secrets:
      BUMP_APP_ID: ${{ secrets.BUMP_APP_ID }}
      BUMP_APP_KEY: ${{ secrets.BUMP_APP_KEY }}
