# Format check, type check, and tests, with diagnostics annotated on PRs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bynk:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bynk-lang/bynk-ci@v1
        with:
          version: 0.371.3   # bump deliberately; the canary tests newer releases
          source: .
      # The payment adapter's TypeScript binding, tested as TypeScript against
      # the out-js/ build that `bynkc test` (above) leaves behind.
      - name: Binding tests
        run: node --test tests/bindings/*.test.cjs
