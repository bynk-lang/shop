# Deploy the shop to Cloudflare Workers with bynk-deploy.
#
# MANUAL ONLY until accuser/bynk#1961 is fixed: `bynk deploy` rejects the
# events from orders to the ledger as a Service Binding cycle, so a dry run on
# every pull request and a deploy on every push would both fail. Restore the
# `push` and `pull_request` triggers when it is.
#
# When enabled, pull requests get an offline dry run (the plan, no
# credentials) and a push to main deploys for real, once these repository
# secrets exist:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with Workers deploy scope
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
#   AUTH_JWT_SECRET        the key the Customer and Admin actors verify tokens with
#   PAYMENTS_API_KEY       the payment processor's API key, for the gateway adapter
#   PAYMENTS_WEBHOOK_SECRET the key the processor signs its webhooks with
# PAYMENTS_API_URL is optional: set it to point the gateway at a sandbox.
# Until they do, the deploy job warns and skips rather than failing main.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  BYNK_VERSION: 0.330.4

jobs:
  plan:
    name: Plan (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bynk-lang/bynk-deploy@v2
        with:
          version: ${{ env.BYNK_VERSION }}
          dry-run: "true"
          plan-format: text

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploy secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT: ${{ secrets.AUTH_JWT_SECRET }}
          PAY_KEY: ${{ secrets.PAYMENTS_API_KEY }}
          PAY_HOOK: ${{ secrets.PAYMENTS_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$JWT" ] || missing="$missing AUTH_JWT_SECRET"
          [ -n "$PAY_KEY" ] || missing="$missing PAYMENTS_API_KEY"
          [ -n "$PAY_HOOK" ] || missing="$missing PAYMENTS_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::warning::Not deploying: set the repository secret(s)${missing} (see README.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.configured == 'true'
        uses: bynk-lang/bynk-deploy@v2
        with:
          version: ${{ env.BYNK_VERSION }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Set on every deployed context. The Customer and Admin actors read
          # AUTH_JWT_SECRET; the payments context reads the rest. Leaving
          # PAYMENTS_PROCESSOR unset is what selects the real processor.
          secrets: |
            AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
            PAYMENTS_API_KEY=${{ secrets.PAYMENTS_API_KEY }}
            PAYMENTS_WEBHOOK_SECRET=${{ secrets.PAYMENTS_WEBHOOK_SECRET }}

      # The action never commits. When the deploy changes bynk.deploy.lock (the
      # first deploy records the context), keep the new file to commit.
      - name: Keep the changed bynk.deploy.lock
        if: always() && steps.deploy.outputs.lock-changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bynk.deploy.lock
          path: bynk.deploy.lock
