# Deploy the shop to Cloudflare Workers with bynk-deploy.
#
# Pull requests get an offline dry run (the plan, no credentials). A push to
# main deploys for real, once these repository secrets exist:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with Workers deploy scope
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
#   AUTH_JWT_SECRET        the key the Customer and Admin actors verify tokens with
#   PAYMENTS_API_KEY       the payment processor's API key, for the gateway adapter
#   PAYMENTS_WEBHOOK_SECRET the key the processor signs its webhooks with
# PAYMENTS_API_URL is optional: set it to point the gateway at a sandbox.
# Until they do, the deploy job warns and skips rather than failing main.
# A deploy that changes bynk.deploy.lock opens a pull request committing it,
# through the org's bump App. The Bynk version is the one in BYNK_VERSION.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bynk-lang/bynk-deploy@v2
        with:
          version-file: BYNK_VERSION
          dry-run: "true"
          plan-format: text

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploy secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT: ${{ secrets.AUTH_JWT_SECRET }}
          PAY_KEY: ${{ secrets.PAYMENTS_API_KEY }}
          PAY_HOOK: ${{ secrets.PAYMENTS_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$JWT" ] || missing="$missing AUTH_JWT_SECRET"
          [ -n "$PAY_KEY" ] || missing="$missing PAYMENTS_API_KEY"
          [ -n "$PAY_HOOK" ] || missing="$missing PAYMENTS_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::warning::Not deploying: set the repository secret(s)${missing} (see README.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The bump App's token, so bynk-deploy can open the pull request that
      # commits a changed bynk.deploy.lock (GITHUB_TOKEN may not open one).
      # Without it, the lock is kept as an artifact to commit by hand.
      - name: Mint the lock pull request token
        id: app-token
        if: steps.secrets.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.configured == 'true'
        uses: bynk-lang/bynk-deploy@v2
        # Declared secrets (an actor's `auth` secret) are read from the
        # environment and set only on the context whose actor declares them:
        # AUTH_JWT_SECRET on orders, PAYMENTS_WEBHOOK_SECRET on payments.
        # Names passed in `secrets` instead would go to every context.
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          PAYMENTS_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_WEBHOOK_SECRET }}
        with:
          version-file: BYNK_VERSION
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          lock-pr-token: ${{ steps.app-token.outputs.token }}

      # The gateway's key. The plan can't see that the gateway's TypeScript
      # binding reads it (it says payments' secrets are incomplete), and a
      # supplied name goes to every context in the run, so it is set in a run
      # for payments alone.
      # Leaving PAYMENTS_PROCESSOR unset is what selects the real processor.
      - name: Set the payment processor's key
        if: steps.secrets.outputs.configured == 'true'
        uses: bynk-lang/bynk-deploy@v2
        env:
          PAYMENTS_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_WEBHOOK_SECRET }}
        with:
          version-file: BYNK_VERSION
          context: shop.payments
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            PAYMENTS_API_KEY=${{ secrets.PAYMENTS_API_KEY }}

      # When the deploy changed bynk.deploy.lock but no pull request could be
      # opened for it (no App token), keep the new file to commit by hand.
      - name: Keep the changed bynk.deploy.lock
        if: always() && steps.deploy.outputs.lock-changed == 'true' && steps.deploy.outputs.lock-pr == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bynk.deploy.lock
          path: bynk.deploy.lock
